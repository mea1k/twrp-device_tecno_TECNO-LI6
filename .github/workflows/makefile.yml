name: Build TWRP TECNO LI6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout TWRP device tree
      uses: actions/checkout@v3
      with:
        repository: mea1k/twrp-device_tecno_TECNO-LI6
        ref: main

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses6 lib32z1 ccache \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc

    - name: Build TWRP
      working-directory: ./twrp-device_tecno_TECNO-LI6
      run: |
        lunch twrp_LI6-eng && mka adbd vendorbootimage -j1

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: twrp-LI6
        path: out/target/product/LI6/vendor_boot.img
