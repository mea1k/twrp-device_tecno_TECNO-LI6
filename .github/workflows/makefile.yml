name: Build TWRP TECNO LI6

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses6 lib32z1 ccache \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc

    - name: Clone TWRP branch android-12.1
      run: |
        git clone -b android-12.1 https://github.com/TeamWin/android_bootable_recovery.git twrp
        cd twrp
        ls -l  # проверка содержимого

    - name: Build TWRP
      working-directory: twrp
      run: |
        source build/envsetup.sh
        lunch twrp_LI6-eng
        # уменьшаем параллельность для GitHub Actions
        mka adbd recoveryimage -j1

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: twrp-LI6
        path: twrp/out/target/product/LI6/recovery.img
