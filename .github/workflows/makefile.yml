name: Build TWRP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up build environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses6 lib32z1 ccache \
          libgl1-mesa-dev libxml2-utils xsltproc unzip

    - name: Setup repo (if needed)
      run: |
        repo init -u https://github.com/TeamWin/android_bootable_recovery.git -b twrp-12.1
        repo sync -c -j2

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        lunch twrp_LI6-eng
        mka adbd recoveryimage -j2

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: twrp-LI6
        path: out/target/product/LI6/recovery.img
